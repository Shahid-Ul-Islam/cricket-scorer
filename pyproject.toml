[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cricket-scorer"
version = "0.1.0"
description = "Ball-by-ball cricket scoring and statistics for amateur clubs (limited-overs)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shahid Ul Islam" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cricket-scorer = "cricket_scorer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
